<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }
        
        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.3);
        }
        
        .game-thumbnail {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        
        .game-info {
            padding: 20px;
        }
        
        .game-title {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #00d4ff;
        }
        
        .game-description {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .game-status {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }
        
        footer {
            text-align: center;
            margin-top: 60px;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Game Center</h1>
            <p class="subtitle">Select a game to play</p>
        </header>
        
        <div class="games-grid" id="gamesGrid">
            <!-- Games will be loaded dynamically -->
        </div>
        
        <footer>
            <p>More games coming soon...</p>
        </footer>
    </div>
    
    <script>
        const games = [
            {
                id: 'grocery-gauntlet',
                name: 'Grocery Gauntlet',
                description: 'Clean up the store before time runs out! First-person supermarket survival game.',
                emoji: '🛒'
            }
        ];
        
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => {
                    window.location.href = `/games/${game.id}`;
                };
                
                card.innerHTML = `
                    <div class="game-thumbnail">${game.emoji}</div>
                    <div class="game-info">
                        <h2 class="game-title">${game.name}</h2>
                        <p class="game-description">${game.description}</p>
                        <span class="game-status">Ready to Play</span>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        renderGames();
    </script>
</body>
</html>
