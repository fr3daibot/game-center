<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }
        
        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.2);
        }
        
        .game-thumbnail {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff9e9e 50%, #ffd166 100%);
        }
        
        .game-thumbnail svg {
            width: 100%;
            height: 100%;
        }
        
        .game-info {
            padding: 20px;
        }
        
        .game-title {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #00d4ff;
        }
        
        .game-description {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .game-status {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }
        
        footer {
            text-align: center;
            margin-top: 60px;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Game Center</h1>
            <p class="subtitle">Select a game to play</p>
        </header>
        
        <div class="games-grid" id="gamesGrid">
            <!-- Games will be loaded dynamically -->
        </div>
        
        <footer>
            <p>More games coming soon...</p>
        </footer>
    </div>
    
    <script>
        const gameIconSVG = `
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Warm orange background -->
            <rect width="200" height="200" fill="url(#warmBg)"/>
            <defs>
                <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#FF8C42"/>
                    <stop offset="50%" style="stop-color:#FF6B35"/>
                    <stop offset="100%" style="stop-color:#E85D04"/>
                </linearGradient>
            </defs>
            
            <!-- Shopping Cart - wireframe side profile -->
            <g id="cart" opacity="0.25">
                <!-- Cart basket (trapezoid - wider at top, narrower at bottom) -->
                <path d="M40 90 L160 90 L130 130 L70 130 Z" 
                      stroke="#fff" stroke-width="2" fill="none"/>
                <!-- Cart handle at front -->
                <path d="M160 90 L175 70 L185 75" 
                      stroke="#fff" stroke-width="2.5" fill="none" 
                      stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Cart frame/bottom -->
                <line x1="70" y1="130" x2="130" y2="130" stroke="#fff" stroke-width="2"/>
                <!-- Cart wheels -->
                <circle cx="70" cy="138" r="7" stroke="#fff" stroke-width="2" fill="none"/>
                <circle cx="130" cy="138" r="7" stroke="#fff" stroke-width="2" fill="none"/>
                <!-- Wheel hubs -->
                <circle cx="70" cy="138" r="2" fill="#fff"/>
                <circle cx="130" cy="138" r="2" fill="#fff"/>
            </g>
            
            <!-- Broom Group -->
            <g id="broom">
                <!-- Broom bristles at bottom -->
                <g id="bristles">
                    <!-- Left side bristles -->
                    <path d="M70 155 Q60 165 50 175" stroke="#D4A574" stroke-width="3" fill="none" stroke-linecap="round">
                        <animate attributeName="d" values="M70 155 Q60 165 50 175;M70 155 Q58 167 45 178;M70 155 Q60 165 50 175" dur="0.3s" repeatCount="indefinite"/>
                    </path>
                    <path d="M78 153 Q68 165 58 177" stroke="#C49A6C" stroke-width="3" fill="none" stroke-linecap="round">
                        <animate attributeName="d" values="M78 153 Q68 165 58 177;M78 153 Q66 167 53 180;M78 153 Q68 165 58 177" dur="0.3s" repeatCount="indefinite"/>
                    </path>
                    <path d="M86 152 Q78 165 70 178" stroke="#D4A574" stroke-width="3" fill="none" stroke-linecap="round">
                        <animate attributeName="d" values="M86 152 Q78 165 70 178;M86 152 Q76 168 65 182;M86 152 Q78 165 70 178" dur="0.3s" repeatCount="indefinite"/>
                    </path>
                    <!-- Right side bristles -->
                    <path d="M94 152 Q102 165 112 178" stroke="#C49A6C" stroke-width="3" fill="none" stroke-linecap="round">
                        <animate attributeName="d" values="M94 152 Q102 165 112 178;M94 152 Q104 168 115 182;M94 152 Q102 165 112 178" dur="0.3s" repeatCount="indefinite"/>
                    </path>
                    <path d="M102 153 Q112 165 122 177" stroke="#D4A574" stroke-width="3" fill="none" stroke-linecap="round">
                        <animate attributeName="d" values="M102 153 Q112 165 122 177;M102 153 Q114 167 125 180;M102 153 Q112 165 122 177" dur="0.3s" repeatCount="indefinite"/>
                    </path>
                    <path d="M110 155 Q120 165 130 175" stroke="#C49A6C" stroke-width="3" fill="none" stroke-linecap="round">
                        <animate attributeName="d" values="M110 155 Q120 165 130 175;M110 155 Q122 167 135 178;M110 155 Q120 165 130 175" dur="0.3s" repeatCount="indefinite"/>
                    </path>
                </g>
                
                <!-- Broom head -->
                <rect x="65" y="140" width="50" height="15" rx="4" fill="#8B5A2B"/>
                <rect x="68" y="142" width="44" height="4" rx="2" fill="#6B4423"/>
                
                <!-- Broom band/connector -->
                <rect x="75" y="132" width="30" height="10" rx="2" fill="#5D4037"/>
                
                <!-- Broom handle -->
                <rect x="82" y="55" width="16" height="80" rx="4" fill="#A0522D"/>
                <rect x="85" y="58" width="4" height="74" rx="2" fill="#8B4513"/>
                
                <!-- Broom sweep rotation - pivot down 1/4, 4x broader sweep -->
                <animateTransform attributeName="transform" type="rotate"
                                  values="-32 90 75; 32 90 75; -32 90 75"
                                  dur="1.2s" repeatCount="indefinite"/>
            </g>
            
            <!-- Debris/Particles flying up from ground level -->
            <g id="debris">
                <circle cx="85" cy="180" r="3" fill="#9CCC65">
                    <animate attributeName="cx" values="85;75;85" dur="0.8s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="180;140;180" dur="0.8s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
                </circle>
                <circle cx="100" cy="175" r="2.5" fill="#FFEE58">
                    <animate attributeName="cx" values="100;115;100" dur="0.7s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="175;130;175" dur="0.7s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/>
                </circle>
                <circle cx="115" cy="178" r="2" fill="#42A5F5">
                    <animate attributeName="cx" values="115;130;115" dur="0.9s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="178;145;178" dur="0.9s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
                </circle>
                <circle cx="95" cy="185" r="2" fill="#FF7043">
                    <animate attributeName="cx" values="95;82;95" dur="0.65s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="185;150;185" dur="0.65s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0;1" dur="0.65s" repeatCount="indefinite"/>
                </circle>
                <circle cx="108" cy="182" r="1.8" fill="#AB47BC">
                    <animate attributeName="cx" values="108;125;108" dur="0.75s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="182;155;182" dur="0.75s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0;1" dur="0.75s" repeatCount="indefinite"/>
                </circle>
            </g>
            
            <!-- POP burst effect -->
            <g id="pop">
                <polygon points="45,60 50,45 60,50 55,35 70,30 55,25 65,10 50,20 35,10 45,25 30,30 45,35 40,50 50,45" 
                         fill="#FFF176" opacity="0.9">
                    <animateTransform attributeName="transform" type="scale"
                                      values="0;1.3;0" dur="0.5s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="rotate"
                                      values="0 50 30;360 50 30" dur="2s" repeatCount="indefinite"/>
                </polygon>
                <circle cx="50" cy="30" r="5" fill="#FFF59D">
                    <animateTransform attributeName="transform" type="scale"
                                      values="0;1.5;0" dur="0.5s" repeatCount="indefinite"/>
                </circle>
            </g>
            
            <!-- Rat running right-to-left (fleeing) - wraps around like Pac-Man -->
            <g id="rat" transform="translate(220, 25)">
                <!-- Rat body -->
                <ellipse cx="140" cy="140" rx="18" ry="10" fill="#6D4C41"/>
                <!-- Rat head -->
                <ellipse cx="125" cy="137" rx="10" ry="8" fill="#5D4037"/>
                <!-- Rat ear -->
                <ellipse cx="120" cy="131" rx="4" ry="5" fill="#4E342E"/>
                <!-- Rat tail (animated wiggle) -->
                <path d="M155 143 Q175 150 180 140" stroke="#4E342E" stroke-width="2" fill="none">
                    <animate attributeName="d" values="M155 143 Q175 150 180 140;M155 140 Q175 130 180 140;M155 143 Q175 150 180 140" dur="0.15s" repeatCount="indefinite"/>
                </path>
                <!-- Rat legs (animated running) -->
                <line x1="135" y1="145" x2="130" y2="153" stroke="#4E342E" stroke-width="2" stroke-linecap="round">
                    <animate attributeName="y1" values="145;140;145" dur="0.15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="153;158;153" dur="0.15s" repeatCount="indefinite"/>
                </line>
                <line x1="145" y1="145" x2="150" y2="153" stroke="#4E342E" stroke-width="2" stroke-linecap="round">
                    <animate attributeName="y1" values="145;150;145" dur="0.15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="153;148;153" dur="0.15s" repeatCount="indefinite"/>
                </line>
                <!-- Run across screen: right-to-left, wrap around seamlessly -->
                <animateTransform attributeName="transform" type="translate"
                                  values="120 25;-240 25" keyTimes="0;1" dur="2.5s" repeatCount="indefinite"/>
            </g>
        </svg>
        `;
        
        const games = [
            {
                id: 'grocery-gauntlet',
                name: 'Grocery Gauntlet',
                description: 'Clean up the store before time runs out! First-person supermarket survival game.',
                icon: gameIconSVG
            }
        ];
        
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => {
                    window.location.href = `/games/${game.id}`;
                };
                
                card.innerHTML = `
                    <div class="game-thumbnail">${game.icon}</div>
                    <div class="game-info">
                        <h2 class="game-title">${game.name}</h2>
                        <p class="game-description">${game.description}</p>
                        <span class="game-status">Ready to Play</span>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        renderGames();
    </script>
</body>
</html>
